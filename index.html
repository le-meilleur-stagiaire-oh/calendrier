<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calendrier Éditorial — Winking 247</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <style>
      *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
      html { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
      body { font-family: 'Inter', 'Helvetica Neue', Helvetica, -apple-system, sans-serif; background: #F8F6F1; }
      input, select, textarea, button { font-family: inherit; }
      input:focus, select:focus, textarea:focus {
        border-color: #B8975A !important;
        box-shadow: 0 0 0 3px rgba(184,151,90,0.12) !important;
        outline: none;
      }
      button { transition: opacity .15s, transform .12s, background .15s, box-shadow .15s; }
      button:active { opacity: 0.75; transform: scale(0.965); }
      button:hover:not(:disabled) { opacity: 0.9; }
      a { text-decoration: none; }
      ::-webkit-scrollbar { width: 5px; height: 5px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: rgba(26,35,50,0.10); border-radius: 10px; }
      ::-webkit-scrollbar-thumb:hover { background: rgba(26,35,50,0.18); }
      ::selection { background: rgba(184,151,90,0.18); color: #1A2332; }
      @media (max-width: 767px) {
        input, select, textarea { font-size: 16px !important; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
